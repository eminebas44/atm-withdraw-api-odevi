version: '3.8'

services:
  db:
    image: postgres:15
    container_name: atm-db
    environment:
      POSTGRES_DB: atm_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"  # 5433 dolu olduğu için 5434 yaptık
    volumes:
      - atm-db-data:/var/lib/postgresql/data
    networks:
      - atmnet
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: atm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - atmnet

  backend:
    build: 
      context: ./backend 
      dockerfile: Dockerfile
    container_name: atm-backend
    ports:
      - "7575:7575"
    depends_on:
      - db
    environment:
      # Backend, Docker içinde 'db' servisine 5432 portundan ulaşır (Değişmez)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/atm_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - atmnet

networks:
  atmnet:
    driver: bridge

volumes:
  atm-db-data: